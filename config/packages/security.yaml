security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

        app_client_provider:
            entity:
                class: App\Entity\Client

    role_hierarchy:
        ROLE_ADMIN: [ROLE_GESTIONNAIRE, ROLE_COMMERCIAL]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        admin:
            lazy: true
            pattern: ^/admin
            provider: app_user_provider
            form_login:
                login_path: app_admin_login
                check_path: app_admin_login
                enable_csrf: true
                default_target_path: app_admin_dashboard
            logout:
                path: app_admin_logout
                # where to redirect after logout
                # target: app_any_route

        main:
            lazy: true
            pattern: ^/
            provider: app_client_provider
            user_checker: App\Security\ClientChecker
            custom_authenticators:
                - App\Security\ClientLoginAuthenticator
            logout:
                path: app_client_logout

    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin/reinitialiser, roles: PUBLIC_ACCESS }
        - { path: ^/admin/logout, roles: PUBLIC_ACCESS }
        - { path: ^/admin/dashboard, roles: [ROLE_COMMERCIAL, ROLE_GESTIONNAIRE] }
        - { path: ^/admin/journal, roles: [ROLE_COMMERCIAL, ROLE_GESTIONNAIRE] }
        - { path: ^/admin/parametrage, roles: ROLE_ADMIN }
        - { path: ^/admin/utilisateurs, roles: ROLE_GESTIONNAIRE }
        - { path: ^/admin/vehicules, roles: ROLE_COMMERCIAL }
        - { path: ^/admin/clients, roles: ROLE_COMMERCIAL }
        - { path: ^/admin, roles: ROLE_COMMERCIAL }
        - { path: ^/espace-client, roles: ROLE_CLIENT }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10