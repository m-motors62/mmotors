security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

        app_client_provider:
            entity:
                class: App\Entity\Client
                property: contact.email

    role_hierarchy:
        ROLE_ADMIN: ROLE_COMMERCIAL

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        admin:
            lazy: true
            pattern: ^/admin
            provider: app_user_provider
            form_login:
                login_path: app_admin_login
                check_path: app_admin_login
            logout:
                path: app_admin_logout

        main:
            lazy: true
            pattern: ^/
            provider: app_client_provider
            form_login:
                login_path: app_client_login
                check_path: app_client_login
            logout:
                path: app_client_logout

    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_COMMERCIAL }
        - { path: ^/espace-client, roles: ROLE_CLIENT }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10